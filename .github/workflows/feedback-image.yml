name: feedback-image

# Образ приёмника отзывов (feedback/) в ghcr.io. На PR — сборка и дымовая проверка без публикации;
# на main — публикация :latest (её подхватывает Watchtower на сервере) и :sha-<коммит> для отката.
on:
  push:
    branches: [ main ]
    paths: [ 'feedback/**', '.github/workflows/feedback-image.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'feedback/**', '.github/workflows/feedback-image.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # отправка в ghcr.io встроенным GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Собрать для проверки
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: feedback
          load: true
          tags: skills-feedback:ci
          cache-from: type=gha,scope=feedback
          cache-to: type=gha,mode=max,scope=feedback

      # Том как на проде (именованный): ловит права на /data, а не только синтаксис. С хоста
      # контейнер видит «внешний» адрес — как запросы через прокси на сервере.
      - name: Дымовая проверка
        shell: bash  # -eo pipefail; проверки ниже — отдельными строками, без && и !: их set -e не ловит
        run: |
          docker volume create fb-ci
          docker run -d --name fb -p 127.0.0.1:8787:8787 -v fb-ci:/data \
            -e FEEDBACK_READ_TOKEN=ci -e FEEDBACK_RATE=3 skills-feedback:ci
          for i in $(seq 1 20); do curl -fs localhost:8787/health && break; sleep 1; done
          check() { got=$(curl -s -o /dev/null -w '%{http_code}' "${@:2}"); echo "$1 → $got  ${*:2}"; [ "$got" = "$1" ]; }
          post() { curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"category":"DOCS","title":"ci: проверка","body":"ключ vibe_api_AbCdEf1234567890xyz в тексте","context":{"skill":"ci","outcome":"done"}}' localhost:8787/feedback; }
          test "$(post)" = 201
          check 403 -H 'Authorization: Bearer ci' localhost:8787/feedback.md     # снаружи закрыто и с токеном
          docker exec fb node -e "fetch('http://127.0.0.1:8787/feedback.md', { headers: { authorization: 'Bearer ci' } }).then(async r => { const t = await r.text(); console.log(r.status, t.split('\n')[0]); process.exit(r.ok && t.includes('| ci |') ? 0 : 1) })"
          docker exec fb node -e "fetch('http://127.0.0.1:8787/feedback.md').then(r => process.exit(r.status === 401 ? 0 : 1))"
          # С 127.0.0.1, но через прокси — это «снаружи».
          docker exec fb node -e "fetch('http://127.0.0.1:8787/feedback.md', { headers: { authorization: 'Bearer ci', 'x-forwarded-for': '203.0.113.1' } }).then(r => process.exit(r.status === 403 ? 0 : 1))"
          # Только формат тикета; запрос считается в лимит (первый post выше + этот = 2 из 3).
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"skill":"ci","issues":[]}' localhost:8787/feedback)" = 400
          # Тот же тикет формой — так шлёт навык (curl --data-urlencode, без JSON в команде).
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-urlencode category=OTHER --data-urlencode 'title=ci: форма' --data-urlencode 'body=Проверка формы, замечаний нет.' --data-urlencode skill=ci-form --data-urlencode outcome=done --data-urlencode helped=a --data-urlencode helped=b localhost:8787/feedback)" = 201
          test "$(post)" = 429                                                    # FEEDBACK_RATE=3 в минуту
          docker exec fb sh -c 'cat /data/*.json' | grep -q '"skill":"ci"'
          docker exec fb sh -c 'cat /data/*.json' | grep -q '"helped":\["a","b"\]'
          if docker exec fb sh -c 'cat /data/*.json' | grep -q '"ip"'; then echo "в отзыве IP"; exit 1; fi
          if docker exec fb sh -c 'cat /data/*.json' | grep -q 'vibe_api_'; then echo "ключ не вычищен"; exit 1; fi
          docker exec fb sh -c 'cat /data/*.json' | grep -q 'скрыто: ключ'
          # Кривой адрес запроса не должен ронять процесс.
          printf 'GET //[ HTTP/1.1\r\nHost: x\r\n\r\n' | nc -q1 127.0.0.1 8787 | head -1 | grep -q ' 400 '
          curl -fs localhost:8787/health

      - name: Лог приёмника
        if: always()
        run: docker logs fb || true

      - name: Вход в GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метки образа
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-feedback
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Опубликовать
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: feedback
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=feedback
