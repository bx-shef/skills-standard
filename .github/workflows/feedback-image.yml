name: feedback-image

# Образ приёмника отзывов (feedback/) в ghcr.io. На PR — сборка и дымовая проверка без публикации;
# на main — публикация :latest (её подхватывает Watchtower на сервере) и :sha-<коммит> для отката.
on:
  push:
    branches: [ main ]
    paths: [ 'feedback/**', '.github/workflows/feedback-image.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'feedback/**', '.github/workflows/feedback-image.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write  # отправка в ghcr.io встроенным GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Собрать для проверки
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: feedback
          load: true
          tags: skills-feedback:ci
          cache-from: type=gha,scope=feedback
          cache-to: type=gha,mode=max,scope=feedback

      # Том как на проде (именованный): ловит права на /data, а не только синтаксис.
      - name: Дымовая проверка
        run: |
          docker volume create fb-ci
          docker run -d --name fb -p 127.0.0.1:8787:8787 -v fb-ci:/data -e FEEDBACK_READ_TOKEN=ci skills-feedback:ci
          for i in $(seq 1 20); do curl -fs localhost:8787/health && break; sleep 1; done
          check() { got=$(curl -s -o /dev/null -w '%{http_code}' "${@:2}"); echo "$1 → $got"; [ "$got" = "$1" ]; }
          check 201 -X POST -d '{"skill":"ci","issues":[]}' localhost:8787/feedback
          check 401 localhost:8787/feedback.md
          check 200 -H 'Authorization: Bearer ci' localhost:8787/feedback.md
          docker exec fb sh -c 'cat /data/*.json' | grep -q '"skill": "ci"'
          ! docker exec fb sh -c 'cat /data/*.json' | grep -q '"ip"'

      - name: Вход в GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Метки образа
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-feedback
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Опубликовать
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: feedback
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=feedback
