name: feedback-vibecode

# Выкладка приёмника отзывов на Битрикс24 Вайбкод Black Hole (feedback/VIBECODE.md) — второй
# таргет рядом с сервером за nginx-proxy.
#
# OPT-IN: джоба идёт, только когда переменная репозитория VIBECODE_DEPLOY = 'true'. До разовой
# настройки слияние этого файла ничего не выкладывает и CI не красит.
#   Secret   VIBE_KEY             vibe_api_… — личный ключ, владеет сервером и оплатой
#   Secret   FEEDBACK_VIBE_ENV    JSON окружения приёмника; FEEDBACK_READ_TOKEN обязателен
#   Variable VIBECODE_DEPLOY      'true' — включатель
#   Variable VIBECODE_APP_NAME    имя сервера (по умолчанию skills-feedback)
# Сервер workflow не создаёт (это платно): первая выкладка — руками, VIBE_CREATE=1.
on:
  push:
    branches: [ main ]
    paths: [ 'feedback/server.js', 'feedback/vibecode.sh', '.github/workflows/feedback-vibecode.yml' ]
  workflow_dispatch:

concurrency:
  group: feedback-vibecode
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.VIBECODE_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Синтаксис
        run: node --check feedback/server.js && bash -n feedback/vibecode.sh

      - name: Выложить
        env:
          VIBE_KEY: ${{ secrets.VIBE_KEY }}
          ENV_JSON: ${{ secrets.FEEDBACK_VIBE_ENV }}
          APP_NAME: ${{ vars.VIBECODE_APP_NAME || 'skills-feedback' }}
        run: feedback/vibecode.sh deploy

      - name: Состояние
        env:
          VIBE_KEY: ${{ secrets.VIBE_KEY }}
          APP_NAME: ${{ vars.VIBECODE_APP_NAME || 'skills-feedback' }}
        run: feedback/vibecode.sh status
