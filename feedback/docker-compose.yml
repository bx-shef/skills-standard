services:
  feedback:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"     # наружу — через nginx с TLS, см. README
    volumes:
      - ./data:/data
    environment:
      FEEDBACK_TOKEN: ""          # пусто — без токена; задать — POST только с Bearer
      FEEDBACK_READ_TOKEN: ""     # пусто — чтение закрыто; задать — GET /feedback* только с Bearer
